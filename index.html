
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BATTLE LIVE 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:white;font-family:Arial;overflow:hidden}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;padding:12px;gap:6px}
.logo{font-weight:900;color:#ffc15a;font-size:19px}
.stat,#queue{background:#111b2bdf;border:1px solid #45536a;padding:9px;border-radius:9px;font-size:12px}
#message{position:absolute;top:72px;width:100%;text-align:center;font-weight:bold;text-shadow:0 2px 5px black}
#queue{position:absolute;right:10px;top:115px}
#feed{position:absolute;bottom:85px;left:12px;font-size:12px}
#bottom{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:7px;pointer-events:auto;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:12px;background:#a95c1c;color:white;font-weight:bold}
.secondary{background:#263750}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="top">
  <div class="logo">⚔ BATTLE LIVE 3D</div>
  <div class="stat">VIVOS: <b id="alive">0</b></div>
  <div class="stat">ELIMINADOS: <b id="dead">0</b></div>
 </div>
 <div id="message">PREPARE-SE PARA A BATALHA</div>
 <div id="queue">PRÓXIMOS: <b id="queueList">0</b></div>
 <div id="feed"></div>
 <div id="bottom">
  <button onclick="addFighter()">+ GUERREIRO</button>
  <button class="secondary" onclick="startBattle()">INICIAR</button>
  <button class="secondary" onclick="resetBattle()">REINICIAR</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>

<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090e19);
scene.fog=new THREE.FogExp2(0x090e19,.012);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300);
camera.position.set(0,20,27);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xb7c9e8,0x29202a,2));

const sun=new THREE.DirectionalLight(0xffd7a0,2.5);
sun.position.set(-12,25,10);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const torchLight=new THREE.PointLight(0xff7028,45,60);
torchLight.position.set(0,9,0);
scene.add(torchLight);

function material(c,m=0,r=.7){
 return new THREE.MeshStandardMaterial({
  color:c,metalness:m,roughness:r
 });
}

function box(parent,w,h,d,mat,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 o.position.set(x,y,z);
 o.castShadow=true;
 o.receiveShadow=true;
 parent.add(o);
 return o;
}

// CHÃO E ARENA
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 material(0x111722)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.6;
ground.receiveShadow=true;
scene.add(ground);

const arena=new THREE.Group();
scene.add(arena);

const base=new THREE.Mesh(
 new THREE.CylinderGeometry(14,15,1,64),
 material(0x242b37,.4)
);
base.position.y=-.1;
arena.add(base);

const floor=new THREE.Mesh(
 new THREE.CylinderGeometry(13.6,13.6,.2,64),
 material(0x514638,.1)
);
floor.position.y=.48;
floor.receiveShadow=true;
arena.add(floor);

for(let i=0;i<3;i++){
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(12-i*.45,.06,8,100),
  material(0xc18b42,.7)
 );
 ring.rotation.x=Math.PI/2;
 ring.position.y=.6+i*.01;
 arena.add(ring);
}

const stone=material(0x343b49,.3);
const gold=material(0xc18b42,.7);

for(let i=0;i<20;i++){
 const a=i/20*Math.PI*2;
 const x=Math.cos(a)*15;
 const z=Math.sin(a)*15;
 box(arena,1.3,5.5,1.3,stone,x,2.5,z);
 box(arena,1.7,.3,1.7,gold,x,5.25,z);
}

for(let row=0;row<4;row++){
 const radius=16+row*1.2;
 const wall=new THREE.Mesh(
  new THREE.CylinderGeometry(radius+1,radius,1.2,64,1,true),
  material(0x171e2a,.2)
 );
 wall.position.y=row*.8+1;
 arena.add(wall);
}

// MODELO 3D
const loader=new THREE.GLTFLoader();
let originalModel=null;
let animationClips=[];
let modelReady=false;

const fighters=[];
const queue=[];
let nextId=1;
let dead=0;
let running=false;
let lastTime=0;

const colors=[
 0xffffff,0x9c3030,0x285bb0,0x25805a,
 0xb17a29,0x713e99,0x222222,0x9b542c,
 0x29929a,0x777777
];

function chooseAnimation(patterns){
 return animationClips.find(c=>
  patterns.some(p=>p.test(c.name))
 );
}

function playAnimation(f,name){
 if(!f.mixer)return;

 const patterns={
  idle:[/idle/i,/stand/i],
  walk:[/walk/i],
  run:[/run/i],
  attack:[/attack/i,/slash/i,/sword/i],
  hit:[/hit/i,/damage/i],
  death:[/death/i,/die/i]
 };

 const clip=chooseAnimation(patterns[name]||[]);
 if(!clip)return;

 if(f.action&&f.current===clip.name)return;

 if(f.action)f.action.fadeOut(.15);

 const action=f.mixer.clipAction(clip);
 action.reset();
 action.setLoop(
  name==="death"?THREE.LoopOnce:THREE.LoopRepeat
 );

 if(name==="death")action.clampWhenFinished=true;

 action.fadeIn(.15).play();
 f.action=action;
 f.current=clip.name;
}

loader.load("knight.glb",gltf=>{
 originalModel=gltf.scene;
 animationClips=gltf.animations||[];

 originalModel.traverse(o=>{
  if(o.isMesh){
   o.castShadow=true;
   o.receiveShadow=true;
  }
 });

 modelReady=true;

 document.getElementById("message").textContent=
 "MODELO 3D CARREGADO!";

 resetBattle();

},undefined,error=>{
 console.error("Erro ao carregar knight.glb:",error);
 document.getElementById("message").textContent=
 "ERRO AO CARREGAR knight.glb";
});

// CRIA GUERREIROS
function makeFighter(id){
 if(!modelReady)return null;

 const model=THREE.SkeletonUtils.clone(originalModel);
 const root=new THREE.Group();
 root.add(model);

 const bounds=new THREE.Box3().setFromObject(model);
 const size=new THREE.Vector3();
 bounds.getSize(size);

 const height=Math.max(size.y,.01);
 const variation=.94+(id%5)*.03;
 const scale=2.65/height*variation;
 model.scale.setScalar(scale);

 const scaledBounds=new THREE.Box3().setFromObject(model);
 model.position.y-=scaledBounds.min.y;

 const color=colors[(id-1)%colors.length];
 const materials=[];

 // Materiais exclusivos de cada guerreiro
 model.traverse(o=>{
  if(!o.isMesh||!o.material)return;

  o.castShadow=true;
  o.receiveShadow=true;

  const original=Array.isArray(o.material)
   ?o.material
   :[o.material];

  const cloned=original.map(m=>{
   const mat=m.clone();

   if(mat.color){
    mat.color.lerp(new THREE.Color(color),.48);
   }

   materials.push(mat);
   return mat;
  });

  o.material=Array.isArray(o.material)?cloned:cloned[0];
 });

 scene.add(root);

 const mixer=new THREE.AnimationMixer(model);

 const f={
  id,group:root,model,mixer,
  hp:100,alive:true,
  speed:1.5+Math.random()*.4,
  attackTimer:Math.random(),
  phase:Math.random()*6,
  action:null,current:"",
  color,materials,
  deathTime:0,
  removed:false
 };

 playAnimation(f,"idle");
 return f;
}

function placeFighter(f){
 const a=Math.random()*Math.PI*2;
 const r=3+Math.random()*8;
 f.group.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
}

function addFighter(){
 if(!modelReady){
  document.getElementById("message").textContent=
   "AGUARDE O MODELO 3D CARREGAR";
  return;
 }

 const f=makeFighter(nextId++);
 if(!f)return;

 if(fighters.filter(x=>x.alive).length<20){
  placeFighter(f);
  fighters.push(f);
 }else{
  queue.push(f);
 }

 updateHUD();
}

function resetBattle(){
 if(!modelReady)return;

 running=false;

 fighters.forEach(f=>{
  scene.remove(f.group);
  f.materials.forEach(m=>m.dispose());
 });

 queue.forEach(f=>{
  scene.remove(f.group);
  f.materials.forEach(m=>m.dispose());
 });

 fighters.length=0;
 queue.length=0;
 dead=0;
 nextId=1;

 for(let i=0;i<10;i++)addFighter();

 document.getElementById("feed").textContent="";
 document.getElementById("message").textContent=
 "PREPARE-SE PARA A BATALHA";

 updateHUD();
}

function startBattle(){
 if(!modelReady||running)return;

 if(fighters.filter(f=>f.alive).length<2){
  addFighter();
  addFighter();
 }

 running=true;

 document.getElementById("message").textContent=
 "⚔ A BATALHA COMEÇOU!";
}

function nearestEnemy(f){
 let target=null;
 let distance=Infinity;

 for(const other of fighters){
  if(other===f||!other.alive)continue;

  const d=f.group.position.distanceTo(other.group.position);

  if(d<distance){
   distance=d;
   target=other;
  }
 }

 return {target,distance};
}

// ELIMINAÇÃO
function eliminate(f){
 if(!f.alive)return;

 f.alive=false;
 f.deathTime=0;

 f.mixer.stopAllAction();
 f.action=null;
 f.current="";

 playAnimation(f,"death");

 dead++;

 document.getElementById("feed").textContent=
 "Guerreiro #"+f.id+" eliminado!";

 if(queue.length&&fighters.filter(x=>x.alive).length<20){
  const next=queue.shift();
  placeFighter(next);
  fighters.push(next);
 }

 updateHUD();
}

// ANIMAÇÃO DE MORTE
function updateDead(f,dt){
 if(f.removed)return;

 f.deathTime+=dt;
 const t=f.deathTime;

 // Inclinação da queda
 const fall=Math.min(t/.85,1);
 const ease=1-Math.pow(1-fall,3);

 f.group.rotation.z=-1.35*ease;
 f.group.rotation.x=.12*ease;
 f.group.position.y=-.12*ease;

 // Atualiza a animação de morte do modelo
 f.mixer.update(dt);

 // Desaparecimento gradual
 if(t>1.8){
  const fade=Math.max(0,1-(t-1.8)/1.2);

  f.materials.forEach(m=>{
   m.transparent=true;
   m.opacity=fade;
   m.depthWrite=fade>.5;
  });
 }

 // Retira da arena
 if(t>=3){
  scene.remove(f.group);
  f.removed=true;
  f.materials.forEach(m=>m.dispose());
 }
}

function damage(f,amount){
 if(!f.alive)return;

 f.hp=Math.max(0,f.hp-amount);

 if(f.hp<=0)eliminate(f);
}

// COMBATE
function updateFighter(f,dt){
 if(!f.alive)return;

 const p=f.group.position;
 const result=nearestEnemy(f);
 const target=result.target;

 if(!target)return;

 const tp=target.group.position;
 const dx=tp.x-p.x;
 const dz=tp.z-p.z;
 const distance=Math.sqrt(dx*dx+dz*dz);
 const angle=Math.atan2(dx,dz);

 f.group.rotation.y=angle;

 if(distance>1.8){
  const step=Math.min(distance-1.5,f.speed*dt);
  p.x+=Math.sin(angle)*step;
  p.z+=Math.cos(angle)*step;

  playAnimation(f,distance>5?"run":"walk");

 }else{
  playAnimation(f,"attack");
  f.attackTimer-=dt;

  if(f.attackTimer<=0){
   f.attackTimer=1+Math.random()*.4;

   if(Math.random()<.75){
    damage(target,8+Math.random()*10);
   }
  }
 }

 const radius=Math.hypot(p.x,p.z);

 if(radius>12){
  p.x*=12/radius;
  p.z*=12/radius;
 }

 f.mixer.update(dt);
}

function updateHUD(){
 document.getElementById("alive").textContent=
 fighters.filter(f=>f.alive).length;

 document.getElementById("dead").textContent=dead;
 document.getElementById("queueList").textContent=queue.length;

 const alive=fighters.filter(f=>f.alive);

 if(running&&alive.length===1&&queue.length===0){
  running=false;

  document.getElementById("message").textContent=
   "🏆 GUERREIRO #"+alive[0].id+" VENCEU!";
 }
}

// CÂMERA
function updateCamera(dt){
 const alive=fighters.filter(f=>f.alive);
 if(!alive.length)return;

 let x=0,z=0;

 alive.forEach(f=>{
  x+=f.group.position.x;
  z+=f.group.position.z;
 });

 x/=alive.length;
 z/=alive.length;

 let spread=0;

 alive.forEach(f=>{
  spread=Math.max(
   spread,
   f.group.position.distanceTo(new THREE.Vector3(x,0,z))
  );
 });

 const d=THREE.MathUtils.clamp(19+spread*1.2,19,36);
 const desired=new THREE.Vector3(x,d*.75,z+d);

 camera.position.lerp(desired,1-Math.exp(-dt*1.7));
 camera.lookAt(x,1,z);
}

// LOOP PRINCIPAL
function animate(now){
 requestAnimationFrame(animate);

 const dt=Math.min((now-lastTime)/1000||0,.04);
 lastTime=now;

 fighters.forEach(f=>{
  if(f.alive){
   if(running)updateFighter(f,dt);
  }else{
   updateDead(f,dt);
  }
 });

 if(running)updateHUD();

 updateCamera(dt);
 renderer.render(scene,camera);
}

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

animate(0);
</script>
</body>
</html>
