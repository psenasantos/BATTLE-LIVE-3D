<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BATTLE LIVE 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px;gap:6px;flex-wrap:wrap}
.logo{font-weight:900;color:#ffc15a;font-size:18px;text-shadow:0 2px 5px #000}
.stat,#queue,#ranking{background:#111b2be8;border:1px solid #45536a;padding:8px 10px;border-radius:9px;font-size:12px}
#message{position:absolute;top:65px;left:0;width:100%;text-align:center;font-weight:bold;text-shadow:0 2px 5px #000;padding:0 12px}
#queue{position:absolute;right:10px;top:105px;max-width:175px}
#ranking{position:absolute;left:10px;top:105px;max-width:170px;line-height:1.5}
#feed{position:absolute;bottom:112px;left:10px;max-width:min(75vw,330px);font-size:12px;text-shadow:0 2px 4px #000;line-height:1.45}
#bottom{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:auto;flex-wrap:wrap;padding:0 8px}
button{border:0;border-radius:9px;padding:11px 12px;background:#a95c1c;color:white;font-weight:bold;font-size:12px}
button.secondary{background:#263750}
button:active{transform:scale(.97)}
#debug{position:absolute;top:65px;right:10px;background:#101722dc;border-radius:8px;padding:6px 8px;font-size:10px;display:none}
@media(max-width:420px){.logo{font-size:15px}.stat{font-size:10px;padding:7px}.top{padding:8px 6px}button{padding:10px 9px;font-size:11px}#ranking{top:102px;max-width:145px;font-size:10px}#queue{top:102px;font-size:10px;max-width:140px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="top">
  <div class="logo">⚔ BATTLE LIVE 3D</div>
  <div class="stat">VIVOS: <b id="alive">0</b></div>
  <div class="stat">ELIMINADOS: <b id="dead">0</b></div>
  <div class="stat">CURTIDAS: <b id="likes">0</b></div>
 </div>
 <div id="message">PREPARE-SE PARA A BATALHA</div>
 <div id="ranking"><b>🏆 RANKING</b><br><span id="rankingList">Aguardando batalha...</span></div>
 <div id="queue">FILA: <b id="queueList">0</b><br><small id="queueNames"></small></div>
 <div id="debug">PONTE LIVE: pronta para receber eventos</div>
 <div id="feed"></div>
 <div id="bottom">
  <button onclick="addFighter()">+ GUERREIRO</button>
  <button class="secondary" onclick="startBattle()">INICIAR</button>
  <button class="secondary" onclick="resetBattle()">REINICIAR</button>
  <button class="secondary" onclick="simulateLike()">❤️ CURTIDA</button>
  <button class="secondary" onclick="simulateGift('rose')">🌹 ROSA</button>
  <button class="secondary" onclick="simulateGift('heart')">💖 CORAÇÃO</button>
  <button class="secondary" onclick="simulateGift('glove')">🥊 LUVA</button>
  <button class="secondary" onclick="simulateGift('lion')">🦁 LEÃO</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
"use strict";
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090e19);
scene.fog=new THREE.FogExp2(0x090e19,.012);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300);
camera.position.set(0,20,27);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
document.getElementById("game").appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb7c9e8,0x29202a,2));
const sun=new THREE.DirectionalLight(0xffd7a0,2.5);
sun.position.set(-12,25,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const torchLight=new THREE.PointLight(0xff7028,45,60);torchLight.position.set(0,9,0);scene.add(torchLight);
function material(c,m=0,r=.7){return new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r});}
function box(parent,w,h,d,mat,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;}

/* ARENA ORIGINAL */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),material(0x111722));
ground.rotation.x=-Math.PI/2;ground.position.y=-.6;ground.receiveShadow=true;scene.add(ground);
const arena=new THREE.Group();scene.add(arena);
const base=new THREE.Mesh(new THREE.CylinderGeometry(14,15,1,64),material(0x242b37,.4));base.position.y=-.1;arena.add(base);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(13.6,13.6,.2,64),material(0x514638,.1));floor.position.y=.48;floor.receiveShadow=true;arena.add(floor);
for(let i=0;i<3;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(12-i*.45,.06,8,100),material(0xc18b42,.7));ring.rotation.x=Math.PI/2;ring.position.y=.6+i*.01;arena.add(ring);}
const stone=material(0x343b49,.3),gold=material(0xc18b42,.7);
for(let i=0;i<20;i++){const a=i/20*Math.PI*2,x=Math.cos(a)*15,z=Math.sin(a)*15;box(arena,1.3,5.5,1.3,stone,x,2.5,z);box(arena,1.7,.3,1.7,gold,x,5.25,z);}
for(let row=0;row<4;row++){const radius=16+row*1.2;const wall=new THREE.Mesh(new THREE.CylinderGeometry(radius+1,radius,1.2,64,1,true),material(0x171e2a,.2));wall.position.y=row*.8+1;arena.add(wall);}

/* AUDIO */
let audioCtx=null,soundEnabled=true;
function initSound(){try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=new C();}if(audioCtx.state==="suspended")audioCtx.resume();}catch(e){console.warn(e);}}
function playSound(type){if(!soundEnabled||!audioCtx)return;const now=audioCtx.currentTime;
 function tone(freq,end,duration,volume,wave="sawtooth",delay=0){const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),start=now+delay;osc.type=wave;osc.frequency.setValueAtTime(freq,start);osc.frequency.exponentialRampToValueAtTime(Math.max(1,end),start+duration);gain.gain.setValueAtTime(.001,start);gain.gain.linearRampToValueAtTime(volume,start+.015);gain.gain.exponentialRampToValueAtTime(.001,start+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(start);osc.stop(start+duration+.02);}
 if(type==="sword"){tone(900,180,.18,.10,"triangle");tone(500,100,.13,.06,"sawtooth",.025);}
 if(type==="hit"){tone(130,45,.22,.16);tone(75,35,.16,.08,"triangle",.025);}
 if(type==="death"){tone(180,55,.65,.15,"triangle");tone(110,35,.75,.08,"sawtooth",.12);}
 if(type==="gift"){tone(620,900,.18,.08,"triangle");tone(900,1200,.22,.08,"triangle",.12);}
 if(type==="victory"){tone(440,440,.22,.10,"triangle");tone(554,554,.22,.10,"triangle",.20);tone(659,659,.30,.12,"triangle",.40);tone(880,880,.55,.13,"triangle",.65);}
}
 /* PERSONAGENS E COMBATE */
const loader=new THREE.GLTFLoader();
let knightModel=null,animations=[];
let modelReady=false;
const fighters=[];
const queue=[];
const ranking={};
let nextId=1,likesTotal=0,deadTotal=0,battleRunning=false,battleEnded=false;
const clock=new THREE.Clock();

function addFeed(msg){
 const feed=document.getElementById("feed");
 const line=document.createElement("div");
 line.textContent=msg;feed.prepend(line);
 while(feed.children.length>5)feed.removeChild(feed.lastChild);
}
function setMessage(msg){document.getElementById("message").textContent=msg;}

loader.load("knight.glb",gltf=>{
 knightModel=gltf.scene;
 animations=gltf.animations||[];
 knightModel.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
 modelReady=true;
 setMessage("GUERREIROS PRONTOS!");
 resetBattle();
},undefined,error=>{
 console.error("Erro ao carregar knight.glb:",error);
 setMessage("ERRO: NÃO FOI POSSÍVEL CARREGAR knight.glb");
});

function aliveFighters(){return fighters.filter(f=>f.alive);}
function randomArenaPosition(){
 const a=Math.random()*Math.PI*2,r=3+Math.random()*7;
 return new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r);
}
function makeFighter(name,isPlayer=false){
 if(!modelReady)return null;
 const id=nextId++;
 const model=THREE.SkeletonUtils.clone(knightModel);
 model.scale.setScalar(1);
 model.position.set(0,0,0);
 const group=new THREE.Group();group.add(model);scene.add(group);
 const mixer=new THREE.AnimationMixer(model);
 let action=null;
 if(animations.length){
  const clip=animations.find(a=>/idle/i.test(a.name))||animations[0];
  action=mixer.clipAction(clip);action.play();
 }
 const pos=randomArenaPosition();
 group.position.copy(pos);
 const f={
  id,name:name||("Guerreiro #"+id),isPlayer,
  group,model,mixer,action,
  hp:100,maxHp:100,alive:true,
  kills:0,damage:10,speed:2.2,
  attackCooldown:Math.random(),
  deathStart:0,shieldUntil:0,doubleUntil:0,lionUntil:0,
  queued:false
 };
 fighters.push(f);
 if(!ranking[f.name])ranking[f.name]={kills:0,wins:0};
 return f;
}
function addFighter(name){
 if(!modelReady){setMessage("AGUARDE O MODELO CARREGAR");return;}
 const fighter=makeFighter(name||("Guerreiro #"+nextId),false);
 if(!fighter)return;
 if(battleRunning&&aliveFighters().length>=12){
  fighter.queued=true;
  fighter.group.visible=false;
  queue.push(fighter);
  addFeed("⏳ "+fighter.name+" entrou na fila!");
 }else{
  addFeed("⚔ "+fighter.name+" entrou na arena!");
 }
 updateHUD();
 return fighter;
}
function joinPlayer(username){
 const name=String(username||"Visitante").trim().slice(0,22)||"Visitante";
 if(fighters.some(f=>f.alive&&f.name.toLowerCase()===name.toLowerCase())||
 queue.some(f=>f.name.toLowerCase()===name.toLowerCase())){
  addFeed("ℹ "+name+" já está na batalha ou na fila.");
  return;
 }
 addFighter(name);
}
function promoteQueue(){
 while(queue.length&&aliveFighters().length<12){
  const f=queue.shift();
  if(!f||!f.group)continue;
  f.queued=false;f.alive=true;f.hp=100;
  f.group.visible=true;
  f.group.position.copy(randomArenaPosition());
  addFeed("🔥 "+f.name+" entrou na arena!");
 }
}
function eliminate(f){
 if(!f.alive)return;
 f.alive=false;f.deathStart=performance.now();
 deadTotal++;
 ranking[f.name].kills=f.kills;
 playSound("death");
 addFeed("💀 "+f.name+" foi eliminado!");
 promoteQueue();
}
function applyDamage(target,amount,attacker){
 if(!target||!target.alive)return;
 const now=Date.now();
 if(target.shieldUntil>now)amount*=.35;
 target.hp=Math.max(0,target.hp-amount);
 playSound("hit");
 if(attacker&&attacker!==target){
  attacker.kills+=target.hp<=0?1:0;
  ranking[attacker.name].kills=attacker.kills;
 }
 if(target.hp<=0)eliminate(target);
}
function updateCombat(dt){
 if(!battleRunning)return;
 const alive=aliveFighters();
 if(alive.length<=1&&queue.length===0){
  if(alive.length===1&&!battleEnded){
   battleEnded=true;
   const winner=alive[0];
   ranking[winner.name].wins++;
   setMessage("🏆 VENCEDOR: "+winner.name);
   playSound("victory");
   addFeed("🏆 "+winner.name+" venceu a batalha!");
  }
  return;
 }
 for(const f of alive){
  f.attackCooldown-=dt;
  const enemies=alive.filter(other=>other!==f);
  if(!enemies.length)continue;
  let target=null,best=Infinity;
  for(const enemy of enemies){
   const d=f.group.position.distanceTo(enemy.group.position);
   if(d<best){best=d;target=enemy;}
  }
  if(!target)continue;
  const direction=new THREE.Vector3().subVectors(target.group.position,f.group.position);
  direction.y=0;
  if(direction.length()>0.001){
   direction.normalize();
   f.group.rotation.y=Math.atan2(direction.x,direction.z);
  }
  if(best>1.8){
   const speed=f.speed*(Date.now()<f.lionUntil?1.6:1);
   f.group.position.add(direction.multiplyScalar(speed*dt));
  }else if(f.attackCooldown<=0){
   const damage=f.damage*(Date.now()<f.doubleUntil?2:1)*(Date.now()<f.lionUntil?1.5:1);
   applyDamage(target,damage,f);
   f.attackCooldown=.85+Math.random()*.4;
   playSound("sword");
  }
 }
}
function updateDead(){
 const now=performance.now();
 for(let i=fighters.length-1;i>=0;i--){
  const f=fighters[i];
  if(!f.alive&&f.deathStart){
   const elapsed=(now-f.deathStart)/1000;
   f.group.rotation.x=Math.min(1.4,elapsed*2);
   f.group.position.y=-Math.min(1.5,elapsed*1.3);
   if(elapsed>2.5){
    scene.remove(f.group);
    f.mixer.stopAllAction();
    fighters.splice(i,1);
   }
  }
 }
}
function startBattle(){
 if(!modelReady){setMessage("AGUARDE O MODELO CARREGAR");return;}
 if(aliveFighters().length<2){setMessage("ADICIONE PELO MENOS 2 GUERREIROS");return;}
 initSound();battleRunning=true;battleEnded=false;
 setMessage("⚔ A BATALHA COMEÇOU!");
 addFeed("⚔ A batalha começou!");
}
function resetBattle(){
 if(!modelReady)return;
 battleRunning=false;battleEnded=false;
 fighters.forEach(f=>{scene.remove(f.group);f.mixer.stopAllAction();});
 fighters.length=0;queue.length=0;
 nextId=1;deadTotal=0;
 for(let i=0;i<10;i++)makeFighter("Guerreiro NPC "+(i+1));
 setMessage("PREPARE-SE PARA A BATALHA");
 updateHUD();
}
function updateHUD(){
 const alive=aliveFighters();
 document.getElementById("alive").textContent=alive.length;
 document.getElementById("dead").textContent=deadTotal;
 document.getElementById("likes").textContent=likesTotal;
 document.getElementById("queueList").textContent=queue.length;
 document.getElementById("queueNames").textContent=queue.slice(0,5).map(f=>f.name).join(", ");
 const sorted=Object.entries(ranking).sort((a,b)=>(b[1].kills+b[1].wins*3)-(a[1].kills+a[1].wins*3)).slice(0,5);
 document.getElementById("rankingList").innerHTML=sorted.length?sorted.map((r,i)=>(i+1)+". "+r[0]+" — "+r[1].kills+" abates / "+r[1].wins+" vitórias").join("<br>"):"Aguardando batalha...";
 }
 /* CURTIDAS, PRESENTES E COMANDOS */
function awardLike(username){
 likesTotal++;
 let target=fighters.find(f=>f.alive&&f.name.toLowerCase()===String(username||"").toLowerCase());
 if(!target){
  const alive=aliveFighters();
  if(alive.length)target=alive[Math.floor(Math.random()*alive.length)];
 }
 if(target){
  target.hp=Math.min(target.maxHp,target.hp+1);
  addFeed("❤️ "+(username||target.name)+" curtiu! +1 HP");
 }
 updateHUD();
}
function applyGift(username,gift){
 const alive=aliveFighters();
 if(!alive.length)return;
 let target=alive.find(f=>f.name.toLowerCase()===String(username||"").toLowerCase());
 if(!target)target=alive[Math.floor(Math.random()*alive.length)];
 const type=String(gift||"").toLowerCase();
 if(type==="rose"||type==="rosa"){
  target.hp=Math.min(target.maxHp,target.hp+5);
  addFeed("🌹 "+(username||target.name)+" enviou uma rosa! +5 HP");
 }else if(type==="heart"||type==="coração"||type==="coracao"){
  target.shieldUntil=Date.now()+15000;
  addFeed("💖 "+(username||target.name)+" ativou escudo por 15s!");
 }else if(type==="glove"||type==="luva"){
  target.doubleUntil=Date.now()+15000;
  addFeed("🥊 "+(username||target.name)+" ativou dano dobrado por 15s!");
 }else if(type==="lion"||type==="leão"||type==="leao"){
  target.lionUntil=Date.now()+20000;
  addFeed("🦁 "+(username||target.name)+" ativou FÚRIA DO LEÃO!");
 }
 playSound("gift");
 updateHUD();
}
function handleComment(username,comment){
 const text=String(comment||"").trim();
 if(!/^!entrar(?:\s|$)/i.test(text))return;
 const match=text.match(/^!entrar\s+(.+)/i);
 joinPlayer(match?match[1].trim():(username||"Visitante"));
}
function receiveLiveEvent(event){
 if(!event)return;
 const username=event.username||event.uniqueId||event.nickname||"Visitante";
 const type=String(event.type||event.event||"").toLowerCase();
 if(type==="like"||type==="digg"||type==="curtida"){
  awardLike(username);
 }else if(type==="gift"||type==="presente"){
  const gift=event.giftName||event.gift||event.name||"rose";
  const giftLower=String(gift).toLowerCase();
  let mapped="rose";
  if(giftLower.includes("heart")||giftLower.includes("coração")||giftLower.includes("coracao"))mapped="heart";
  else if(giftLower.includes("glove")||giftLower.includes("luva"))mapped="glove";
  else if(giftLower.includes("lion")||giftLower.includes("leão")||giftLower.includes("leao"))mapped="lion";
  applyGift(username,mapped);
 }else if(type==="comment"||type==="chat"||type==="comentario"){
  handleComment(username,event.comment||event.text||event.message||"");
 }else if(type==="join"||type==="entrar"){
  joinPlayer(username);
 }
}
function simulateLike(){initSound();awardLike();}
function simulateGift(type){initSound();applyGift("",type);}

/* PONTE PARA UMA FUTURA CONEXÃO COM LIVE */
window.BattleLive={
 receive:receiveLiveEvent,
 join:joinPlayer,
 like:awardLike,
 gift:applyGift,
 comment:handleComment
};
window.addEventListener("message",e=>{
 const data=e.data;
 if(data&&data.source==="battle-live-bridge"&&data.event){
  receiveLiveEvent(data.event);
 }
});

/* ANIMAÇÃO E CÂMERA */
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 for(const f of fighters){
  if(f.mixer)f.mixer.update(dt);
 }
 updateCombat(dt);
 updateDead();
 const alive=aliveFighters();
 if(alive.length){
  const center=new THREE.Vector3();
  alive.forEach(f=>center.add(f.group.position));
  center.divideScalar(alive.length);
  const desired=new THREE.Vector3(center.x,center.y+17,center.z+24);
  camera.position.lerp(desired,.035);
  camera.lookAt(center.x,center.y+1,center.z);
 }
 updateHUD();
 renderer.render(scene,camera);
}
animate();

/* AJUSTE DE TELA */
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
});

/* INICIALIZAÇÃO */
document.addEventListener("click",initSound,{once:true});
</script>
</body>
</html>
